[project]
name = "settle-pipeline"
version = "0.1.0"
description = "Offline data pipeline for Settle: loads area data into Postgres/PostGIS."
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["settle_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
